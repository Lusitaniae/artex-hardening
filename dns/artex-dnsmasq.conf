# ARTEX lab logging DNS forwarder.
# Bound only to the docker bridge gateway; containers query this, it forwards
# upstream, and every query is logged with the client source address.
bind-interfaces
listen-address=172.18.0.1
port=53
no-resolv
server=1.1.1.1
server=1.0.0.1
no-hosts
domain-needed
bogus-priv
cache-size=1000
log-queries
log-facility=/var/log/artex-dns.log
log-async=5

# Docker service names. dnsmasq runs on the host and cannot query Docker's
# embedded resolver (127.0.0.11 lives in the container netns), so names the app
# uses in its DSN must be declared here. Without this, `postgres` NXDOMAINs and
# the app enters a reconnect loop (observed 2026-11-08 09:39-10:31, ~61 q/s,
# task/activity/notification writes all failing). IP is pinned by compose
# extra_hosts as well, so /etc/hosts answers if this file is ever wrong.
host-record=postgres,172.18.0.2
