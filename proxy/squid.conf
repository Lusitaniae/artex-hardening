# Egress relay for the default (recommended) mode.
#
# The containers may reach exactly one host:port — 172.28.0.1:3128. This proxy decides
# where model traffic actually goes, by DOMAIN, so provider IP rotation and CDN
# fronting stop being a problem. Everything not on the allowlist is refused, and the
# refusal is logged.
#
# Run on the host (not in the compose stack):
#   sudo apt install squid
#   sudo cp proxy/squid.conf /etc/squid/squid.conf
#   sudo systemctl restart squid
#
# Verify:
#   curl -x http://172.28.0.1:3128 -sS -o /dev/null -w '%{http_code}\n' https://api.deepseek.com/v1/models
#   curl -x http://172.28.0.1:3128 -sS --max-time 6 https://example.com   # must be refused

http_port 172.28.0.1:3128

# No caching, no storing of response bodies. Prompt contents are client data.
cache deny all
cache_mem 0 MB

# --- the allowlist -------------------------------------------------------
acl llm_domains dstdomain .deepseek.com
acl llm_domains dstdomain .orcarouter.ai
acl llm_domains dstdomain .api.openai.com
acl llm_domains dstdomain .anthropic.com

# Engagement scope, name-level. This is what stops "allow Cloudflare" from
# meaning "allow every Cloudflare customer": nftables admits the CDN edge,
# this ACL admits only the client's names on that edge.
#
# BEGIN scope_domains (generated by scripts/render-squid-scope.sh — do not edit by hand)
# Empty until you populate nftables/scope.domains.allow for the active profile.
# An empty ACL denies every name, which is the correct default: no scope, no reach.
# END scope_domains

# BEGIN scope_ips (generated by scripts/render-squid-scope.sh — do not edit by hand)
# Empty until you populate nftables/scope.allow for the active profile, then run
#   ./scripts/render-squid-scope.sh --profile <engagement>
# Everything outside the rendered prefixes is still name-gated: a bare IP on the
# CDN or anywhere else stays denied. An empty block denies all IP literals.
# END scope_ips

# Attribution lookups. The agent needs to answer "who owns this IP" to keep its
# own scope reasoning honest, and the RDAP registries are the public answer. This
# is outbound *query* traffic only -- it reveals which addresses are being
# investigated, to a public registry, and nothing about the target's content.
acl attribution_domains dstdomain .arin.net .ripe.net .apnic.net .lacnic.net .afrinic.net .rdap.org

acl SSL_ports port 80 443 8080   # recorder tunnels everything as CONNECT, incl. plain HTTP
acl Safe_ports port 80 443 8080   # 8080: RPC/API services on in-scope hosts
acl CONNECT method CONNECT

# Default deny, in order.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow CONNECT llm_domains
http_access allow llm_domains
http_access allow CONNECT scope_domains
http_access allow scope_domains
http_access allow scope_ips
http_access allow CONNECT attribution_domains
http_access allow attribution_domains
# BEGIN open_mode (toggled by scripts/egress-apply.sh --open / scoped apply)
# In open mode the relay is a logging proxy, not a scope control: the kernel
# already allows public egress and the application owns scope. Keep this line
# only while --open is active; a scoped apply removes it.
# END open_mode

http_access deny all

# --- accountability ------------------------------------------------------
# You want this log. It is the record of what the agent asked the model to do.
access_log /var/log/squid/artex-access.log
cache_log /var/log/squid/artex-cache.log

# --- identity ------------------------------------------------------------
# Anonymous proxy: no auth. That is acceptable ONLY because the listener is bound to
# the docker bridge gateway and nftables permits nothing else to reach it.
# If you ever move this off 172.28.0.1, add auth_program or basic auth first.
visible_hostname artex-egress

# Never forward client IPs upstream (reduces leakage of lab topology).
forwarded_for delete
via off
